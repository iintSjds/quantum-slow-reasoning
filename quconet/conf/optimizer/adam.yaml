# @package _global_
optimizer:
  _target_: torch.optim.Adam
  lr: ${training.learning_rate}
  weight_decay: ${training.weight_decay}
  betas: [0.9, 0.999]
  eps: 1e-8

# Learning rate scheduler
scheduler:
  _target_: null  # null for no scheduler, or specify scheduler class

  # Example scheduler configurations (uncomment to use)

  # Step scheduler
  # _target_: torch.optim.lr_scheduler.StepLR
  # step_size: 30
  # gamma: 0.1

  # Cosine annealing
  # _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  # T_max: ${training.num_epochs}
  # eta_min: 1e-6

  # Reduce on plateau
  # _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  # mode: max
  # factor: 0.5
  # patience: 10
  # threshold: 0.01
  # min_lr: 1e-6